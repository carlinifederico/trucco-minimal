<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRUCCO — Creative Group</title>
<meta name="description" content="TRUCCO — a creative and collaborative group focused on branding &amp; audiovisual. Show Reel · Selected Works 2026.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="TRUCCO — Creative Group">
<meta property="og:description" content="Show Reel · Selected Works 2026">
<meta property="og:image" content="assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Geist+Mono:wght@300;400&family=Geist:wght@300;400;800&display=swap">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<!-- Llegada: reel de fondo + logo -->
<header class="hero">
  <video class="hero__reel" autoplay muted loop playsinline preload="auto" poster="assets/reel-poster.jpg" aria-hidden="true">
    <source src="assets/reel-720.mp4" type="video/mp4" media="(max-width: 900px)">
    <source src="assets/reel-1080.mp4" type="video/mp4">
  </video>
  <div class="hero__shade"></div>
  <h1 class="wordmark">TRUCCO</h1>
  <p class="hero__caption"><span>Show Reel</span><i></i><span>Selected Works 2026</span></p>
  <a class="hero__down" href="#about" aria-label="About us">Scroll</a>
</header>

<!-- About + contacto -->
<main id="about" class="about">
  <p class="label" data-reveal>About us</p>
  <p class="statement">
    <span class="line" data-reveal><i>We are a</i> <b>Creative</b></span>
    <span class="line" data-reveal><i>and</i> <b>Collaborative</b></span>
    <span class="line" data-reveal><b>Group</b> <i>focused on</i></span>
    <span class="line" data-reveal><b class="hollow">Branding</b> <i>&amp;</i></span>
    <span class="line" data-reveal><b class="hollow">Audiovisual</b></span>
  </p>

  <div class="people">
    <div class="person person--0" data-reveal>
      <h2 class="person__name" data-name="Federico&#10;Carlini">Federico<br>Carlini</h2>
      <p class="person__role">Creative Director</p>
      <a class="person__link" href="https://federicocarlini.com" target="_blank" rel="noopener"><span>federicocarlini.com</span> <span class="arrow">↗</span></a>
    </div>
    <div class="person person--1" data-reveal>
      <h2 class="person__name" data-name="Santiago&#10;Tereso">Santiago<br>Tereso</h2>
      <p class="person__role">Executive Producer</p>
      <!-- TODO: LinkedIn real de Santiago -->
      <a class="person__link" href="https://www.linkedin.com/" target="_blank" rel="noopener"><span>LinkedIn</span> <span class="arrow">↗</span></a>
    </div>
  </div>

  <footer class="contact" data-reveal>
    <!-- TODO: mail definitivo -->
    <a class="contact__mail" href="mailto:hello@trucco.studio">hello@trucco.studio <span class="arrow">↗</span></a>
    <span>Buenos Aires</span>
    <span>© 2026 TRUCCO</span>
  </footer>
</main>

<script>
  // aparición al entrar en pantalla
  const io = new IntersectionObserver((entries) => entries.forEach((e) => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  }));
  document.querySelectorAll('[data-reveal]').forEach((el, i) => { el.style.transitionDelay = `${(i % 6) * 70}ms`; io.observe(el); });
</script>
</body>
</html>
